# nginx для SPA (React Router): усі невідомі шляхи → index.html.
# /api/* сюди не доходить — ALB роутить його на бекенд.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Health check для ALB target group
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Хешовані ассети Vite — довгий кеш
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback; сам index.html не кешуємо, щоб нові деплої підхоплювались
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
