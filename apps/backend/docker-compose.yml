# apps/backend/docker-compose.yml
# Запуск: docker compose up -d  (з папки apps/backend)

services:
  postgres:
    image: postgres:18-alpine
    container_name: car_calculator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       car_calculator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
